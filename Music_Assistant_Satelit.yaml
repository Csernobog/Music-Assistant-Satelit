            - if:
                condition:
                  not:
                    - voice_assistant.is_running
                then:
                  - micro_wake_word.start
                  - lvgl.label.update:
                      id: ww_status
                      text: "\U000F07C5"

    on_turn_off:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:      
            - voice_assistant.stop
            - micro_wake_word.stop
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
            - lvgl.label.update:
                id: ww_status
                text: "\U000F0A45"

  - platform: template
    name: "Ring Timer"
    id: timer_ringing
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
        - media_player.stop:
            announcement: true
       
    on_turn_on:
        - while:
            condition:
                switch.is_on: timer_ringing
            then:
                - media_player.speaker.play_on_device_media_file:
                    media_file: alarm_sound
                    announcement: true
                - wait_until:
                    media_player.is_announcing:
                - wait_until:
                    not:
                      media_player.is_announcing:
                
                - delay: 1000ms
# ============================
#   Intervals
# ============================
interval:
  - interval: 5s
    then:
      - if:
          condition:
            binary_sensor.is_on: api_ready
          then:
            - if:
                condition:
                  lambda: 'return !id(already_fetched);'
                then:
                  - logger.log: "API up → fetching MA library…"
                  - script.execute: refresh_radios
                  - lambda: 'id(already_fetched) = true;'
  - interval: 1s
    then:
      - lvgl.label.update:
          id: player_header_clock
          text: !lambda |-
            char buf[16];
            time_t now = id(ha_time).now().timestamp;
            strftime(buf, sizeof(buf), "%H:%M", localtime(&now));
            return std::string(buf);                
# ============================
#   Scripts
# ============================
script:
  - id: nav_prev
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return id(radio_subpage) > 0;'
                then:
                  - lambda: |-
                      id(radio_subpage)--;
                  - script.execute: update_radio_icons
                else:
                  # első rádió oldalról vissza a főoldalra
                  - lvgl.page.show: main_page
                  - lambda: |-
                      id(current_page) = 0;
      - if:
          condition:
            lambda: 'return id(current_page) == 0;'
          then:
            - lvgl.page.previous:



  - id: nav_next
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 0;'
          then:
            # főképernyőről lépjünk át a rádió oldalra
            - lvgl.page.show: radio_page
            - lambda: |-
                id(current_page) = 1;
                id(radio_subpage) = 0;
            - script.execute: update_radio_icons
          else:
            # már rádió oldalon vagyunk → lapozzunk a következő 8-as blokkal
            - if:
                condition:
                  lambda: 'return id(current_page) == 1 && id(radio_subpage) < id(max_subpage);'
                then:
                  - lambda: |-
                      id(radio_subpage)++;
                  - script.execute: update_radio_icons
                else:
                  - if:
                      condition:
                        lambda: 'return id(player_active);'
                      then:
                        - lvgl.page.show: player_page
                        - lambda: |-
                            id(current_page) = 2;  


  - id: nav_home
    then:
      - lvgl.page.show: main_page
      - lambda: |-
          id(current_page) = 0;

  - id: calc_max_subpage
    mode: single
    then:
      - lambda: |-
          id(max_subpage) = (id(radio_count) - 1) / 8;

  - id: update_radio_icons
    mode: single
    then:
      - lambda: |-
          // ha még nincsenek készen az ikonok vagy nincs rádió, lépjünk ki
          if (!id(icons_downloaded) || id(radio_count) == 0) {
            ESP_LOGI("RADIO", "update_radio_icons: icons not ready (icons_downloaded=%d, radio_count=%d)",
                     id(icons_downloaded), id(radio_count));
            return;
          }

          lv_obj_t* btns[8] = {
            id(btn0), id(btn1), id(btn2), id(btn3),
            id(btn4), id(btn5), id(btn6), id(btn7)
          };

          lv_obj_t* imgs[8] = {
            id(btn0_img), id(btn1_img), id(btn2_img), id(btn3_img),
            id(btn4_img), id(btn5_img), id(btn6_img), id(btn7_img)
          };

          for (int x = 0; x < 8; x++) {
            int icon_index = id(radio_subpage) * 8 + x;

            if (icon_index >= id(radio_count)) {
              // nincs már ennyi rádió → gomb elrejtése
              lv_obj_add_flag(btns[x], LV_OBJ_FLAG_HIDDEN);
              continue;
            }

            lv_obj_clear_flag(btns[x], LV_OBJ_FLAG_HIDDEN);

            // online_image → LVGL image descriptor pointer
            auto img_ptr = id(radio_icons)[icon_index]->get_lv_image_dsc();
            lv_img_set_src(imgs[x], img_ptr);
          }



  - id: init_radio_icons
    mode: single
    then:
      - lambda: |-
          id(radio_icons)[0] = id(radio_icon_0);
          id(radio_icons)[1] = id(radio_icon_1);
          id(radio_icons)[2] = id(radio_icon_2);
          id(radio_icons)[3] = id(radio_icon_3);
          id(radio_icons)[4] = id(radio_icon_4);
          id(radio_icons)[5] = id(radio_icon_5);
          id(radio_icons)[6] = id(radio_icon_6);
          id(radio_icons)[7] = id(radio_icon_7);
          id(radio_icons)[8] = id(radio_icon_8);
          id(radio_icons)[9] = id(radio_icon_9);
          id(radio_icons)[10] = id(radio_icon_10);
          id(radio_icons)[11] = id(radio_icon_11);
          id(radio_icons)[12] = id(radio_icon_12);
          id(radio_icons)[13] = id(radio_icon_13);
          id(radio_icons)[14] = id(radio_icon_14);
          id(radio_icons)[15] = id(radio_icon_15);
          id(radio_icons)[16] = id(radio_icon_16);
          id(radio_icons)[17] = id(radio_icon_17);
          id(radio_icons)[18] = id(radio_icon_18);
          id(radio_icons)[19] = id(radio_icon_19);
          id(radio_icons)[20] = id(radio_icon_20);
          id(radio_icons)[21] = id(radio_icon_21);
          id(radio_icons)[22] = id(radio_icon_22);
          id(radio_icons)[23] = id(radio_icon_23);

  - id: refresh_radios
    mode: single        # FONTOS! Egyszer fusson, ne restartoljon!
    then:
      - lambda: |-
          if (id(radios_fetched)) {
            ESP_LOGI("RADIO", "refresh_radios skipped – radios already fetched");
            return;
          }
          ESP_LOGI("RADIO", "UI → MA radio_list update triggered…");

      - while:
          condition:
            lambda: "return !id(already_fetched);"
          then:
            - logger.log: "UI → Fetching radios from HA (pyscript)..."
            - homeassistant.service:
                service: pyscript.get_ma_radios
            - delay: 5s
            - lvgl.label.update:
                id: boot_label
                text: "Radios fetched..."

      - lambda: |-
          ESP_LOGI("RADIO", "Radio list fetch completed.");
          id(radios_fetched) = true;

  - id: all_icons_downloaded
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("RADIO", "All icons are ready!");
          id(icons_downloaded) = true;
      - script.execute: init_radio_icons
      - script.execute: calc_max_subpage
      - script.execute: update_radio_icons
      - lvgl.page.show: main_page
      - lambda: |-
          id(ui_ready) = true;
      - light.turn_off: led
      - micro_wake_word.start: # ASSIST START!!!!!!
      - lvgl.label.update:
          id: ww_status
          text: "\U000F07C5"

         

  - id: time_update
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
             return id(ha_time).now().strftime("%H:%M");

      - lvgl.label.update:    
          id: lbl_date
          text: !lambda |-
             return id(ha_time).now().strftime("%Y/%m/%d");

      - lvgl.label.update:
          id: lbl_temp
          text: !lambda |-
            if (id(ha_temp).has_state()) {
              return (id(ha_temp).state + " °C");
            } else {
              return std::string("-- °C");
            }

      - lvgl.label.update:
          id: lbl_hum
          text: !lambda |-
            if (id(ha_hum).has_state()) {
              return (id(ha_hum).state + " %");
            } else {
              return std::string("-- %");
            }               
                              
      - logger.log: "update Time script ran"       

  - id: icon_download_step
    mode: single
    then:
      - lambda: |-
          id(icon_count)++;
          ESP_LOGI("ICON", "Icon downloaded (%d/%d)", id(icon_count), id(icon_total));

          id(current_icon_download)++;

          if (id(current_icon_download) < id(icon_total)) {
            ESP_LOGI("ICON", "Starting next icon: %d", id(current_icon_download));

            switch (id(current_icon_download)) {
              case 0:  id(radio_icon_0).update(); break;
              case 1:  id(radio_icon_1).update(); break;
              case 2:  id(radio_icon_2).update(); break;
              case 3:  id(radio_icon_3).update(); break;
              case 4:  id(radio_icon_4).update(); break;

              case 5:  id(radio_icon_5).update(); break;
              case 6:  id(radio_icon_6).update(); break;
              case 7:  id(radio_icon_7).update(); break;
              case 8:  id(radio_icon_8).update(); break;
              case 9:  id(radio_icon_9).update(); break;

              case 10: id(radio_icon_10).update(); break;
              case 11: id(radio_icon_11).update(); break;
              case 12: id(radio_icon_12).update(); break;
              case 13: id(radio_icon_13).update(); break;
              case 14: id(radio_icon_14).update(); break;

              case 15: id(radio_icon_15).update(); break;
              case 16: id(radio_icon_16).update(); break;
              case 17: id(radio_icon_17).update(); break;
              case 18: id(radio_icon_18).update(); break;
              case 19: id(radio_icon_19).update(); break;

              case 20: id(radio_icon_20).update(); break;
              case 21: id(radio_icon_21).update(); break;
              case 22: id(radio_icon_22).update(); break;
              case 23: id(radio_icon_23).update(); break;
            }
          } else {
            id(icons_downloaded) = true;
            ESP_LOGI("ICON", "All icons downloaded!");
            id(all_icons_downloaded).execute();
          }

  - id: start_wake_word
    mode: queued
    then:
      - if:
          condition:
            and:
              - switch.is_on: voice_enabled
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
                    id: speaker_media_player_id
          then:
            - logger.log: "Wake word ON (script)"
            - micro_wake_word.start
            - lvgl.label.update:
                id: ww_status
                text: "\U000F07C5"

  - id: stop_wake_word
    mode: queued
    then:
      - logger.log: "Wake word OFF (script)"
      - micro_wake_word.stop
      - lvgl.label.update:
          id: ww_status
          text: "\U000F0A45"

  - id: update_player_icon
    then:
      - lambda: |-
          if (id(player_source) == 1) {
            lv_img_set_src(
              id(player_icon),
              id(radio_icons)[id(current_radio_index)]
            );
          } else if (id(player_source) == 2) {
            lv_img_set_src(
              id(player_icon),
              id(album_cover)
            );
          } else if (id(player_source) == 3) {
            lv_img_set_src(
              id(player_icon),
              id(album_cover)
            );                            
          }
  
  - id: cover_kick
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("COVER", "Cover download started");    
          if (id(cover_busy)) return;
          if (id(cover_pending_url).empty()) return;
          ESP_LOGI("COVER", "Cover download started");    
          id(cover_busy) = true;

          std::string url = id(cover_pending_url);
          id(cover_pending_url).clear();

          ESP_LOGI("COVER", "Starting download: %s", url.c_str());
          id(album_cover).release();
          id(album_cover).set_url(url.c_str());
          id(album_cover).update();
          lv_img_set_src(
              id(player_icon),
              id(album_cover)
          );



  
