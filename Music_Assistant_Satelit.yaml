substitutions:
  # Change it according to your configuration.
  name: "assist-halo"                                   # This ESP HA name
  friendly_name: Assist_halo                            # This ESP HA mediaplayer and fridenly name
  media_player_name: media_player.assist_halo_2         # This ESP MA mediaplayer name
  ha_ip: "192.168.0.60"                                 # HA server IP local
  ha_port: "8123"                                       # HA server port
  st_ip: 192.168.0.238
  gw_ip: 192.168.0.1
  subn: 255.255.255.0
  dns_ip1: 192.168.0.1
  dns_ip2: 8.8.8.8   
  HA_TEMP: sensor.homero_halo_homerseklet               # startup screen temperature sensor entity name from HA
  HA_HUMI: sensor.homero_halo_paratartalom              # startup screen humidity sensor entity name from HA
  startup_screen_switch: konnektor_halo                 # startup screen switch entity name from HA --> LAMP ICON

  i2s_lrclk: GPIO06
  i2s_bclk: GPIO07
  spk: GPIO08
  i2s_ws: GPIO03
  i2s_sck: GPIO02
  mic: GPIO04
  ledpin: GPIO48
  micro_wake_word_model: hey_jarvis               # Other options are: hey_jarvis or alexa
  timer_alarm_sound: "sounds/timer_finished.wav"  # in the esphome/sounds folder
  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id: "11"
  voice_assist_muted_phase_id: "12"
  voice_assist_timer_finished_phase_id: "20"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.mcu: esp32s3

  on_boot:
    priority: -100
    then:
      - lvgl.page.show:
          id: boot_page
      - logger.log: "Boot page show"
      - light.turn_on:
          id: led           
          red: 0%
          green: 100%
          blue: 0%
          brightness: 60%
          effect: fast pulse 
  on_shutdown:
    then:
      # Prevent loud noise on software restart
      #- lambda: id(speaker).mute_speaker();


esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHZ
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5
      CONFIG_AUDIO_BOARD_CUSTOM: "y"
      CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM: "512"
      CONFIG_TCPIP_RECVMBOX_SIZE: "512"
      CONFIG_TCP_SND_BUF_DEFAULT: "65535"
      CONFIG_TCP_WND_DEFAULT: "512000"
      CONFIG_TCP_RECVMBOX_SIZE: "512"
      

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  id: api_server
  encryption:
    key: !secret api_key 
  
 

  on_client_connected:
    then:
    - logger.log: "API Connected - start fetching radios"
    - lvgl.label.update:
                id: boot_label
                text: "API connected..."
      
    - script.execute: refresh_radios
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus
    - voice_assistant.stop

ota:
  - platform: esphome
    password: !secret ota_password
    on_end: 
      then:
        - lvgl.page.show: boot_page

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${st_ip}
    gateway: ${gw_ip}
    subnet: ${subn}
    dns1: ${dns_ip1}
    dns2: ${dns_ip2}

  fast_connect: True
  enable_btm: True
  enable_rrm: True
  power_save_mode: NONE

network:
  enable_ipv6: True
# ============================
#   ASSIST_HARDWARE_SETTING
# ============================
i2s_audio:
  - id: i2s
    i2s_lrclk_pin: ${i2s_lrclk}
    i2s_bclk_pin: ${i2s_bclk}
  - id: i2s_in
    i2s_lrclk_pin: ${i2s_ws}
    i2s_bclk_pin: ${i2s_sck}

microphone:
  - platform: i2s_audio
    id: mic_id
    adc_type: external
    i2s_din_pin: ${mic}
    channel: left
    i2s_audio_id: i2s_in

speaker:
  - platform: i2s_audio
    id: speaker_id
    i2s_audio_id: i2s
    dac_type: external
    i2s_dout_pin:   
      number: ${spk}
    sample_rate: 48000
    buffer_duration: 120ms

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input

  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

# ============================
#   SPI def
# ============================
spi:
  id: spi_bus1
  clk_pin: GPIO15
  mosi_pin: GPIO13
  miso_pin: GPIO14
  

# ============================
#   Lights
# ============================
output:
  - platform: ledc
    id: tft_led_pwm
    pin: GPIO16
    frequency: 20000 Hz
    

light:
  - platform: monochromatic
    output: tft_led_pwm
    id: backlight
    name: "TFT háttérvilágítás"
    restore_mode: ALWAYS_ON
    
  - platform: esp32_rmt_led_strip
    id: led
    name: "Status LED"
    chipset: WS2812
    pin: ${ledpin}
    num_leds: 1
    rgb_order: GRB
    restore_mode: ALWAYS_OFF      
    effects:
        - pulse:
            name: "Slow Pulse"
            transition_length: 250ms
            update_interval: 250ms
            min_brightness: 50%
            max_brightness: 100%
        - pulse:
            name: "Fast Pulse"
            transition_length: 100ms
            update_interval: 100ms
            min_brightness: 50%
            max_brightness: 100%
        - addressable_scan:
            name: "Scan"
            move_interval: 50ms
            scan_width: 2
        - addressable_lambda:
            name: Volume Level Display
            update_interval: 500ms
            lambda: |-
              float volume = id(speaker_media_player_id).volume;
              int num_leds_on = round(volume * 4);
              for (int i = 0; i < it.size(); i++) {
                if (i < num_leds_on) {
                  it[i] = Color(0, 0, 255); // Blue
                } else {
                  it[i] = Color::BLACK;
                }
              }

# ============================
#   LVGL display driver (ili9xxx)
# ============================
display:
  - platform: ili9xxx
    id: my_display
    invert_colors: False
    model: ili9341
    cs_pin: GPIO10
    dc_pin: GPIO12
    reset_pin: GPIO11
    spi_id: spi_bus1
    data_rate: 10MHz
    #rotation: 270               # Fekvő mód ✔
    dimensions:
      width: 240
      height: 320
    auto_clear_enabled: false
    update_interval: 5s 
     
# ============================
#   LVGL touch driver (XPT2046)
# ============================
touchscreen:
  - platform: xpt2046
    id: my_touchscreen
    display: my_display
    calibration:
      x_min: 200
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      mirror_y: true
    threshold: 900

    cs_pin: GPIO17
    interrupt_pin:
      number: GPIO18
      mode:
        input: true
        pulldown: true           # <-- A fő javítás ✔
    spi_id: spi_bus1
    #update_interval: 50ms
    touch_timeout: 1s
      
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

http_request:
# ============================
#   Variables - Globals
# ============================
globals:
  - id: ha_apis_ready #api connection ready?
    type: bool
    initial_value: "false"

  - id: radios_fetched #sensor data collector ready?
    type: bool
    initial_value: "false" 
  
  - id: current_icon_download # icon download counter
    type: int
    initial_value: "0"

  - id: icons_downloaded #icon collector ready?
    type: bool
    initial_value: "false"

  - id: ui_ready #main display ready?
    type: bool
    initial_value: "false"  

  - id: already_fetched
    type: bool
    initial_value: 'false'
  
  - id: radio_items
    type: std::vector<std::tuple<std::string, std::string, std::string>>
    initial_value: 'std::vector<std::tuple<std::string, std::string, std::string>>()'
    restore_value: false

  - id: current_screen
    type: int
    initial_value: "1"   # 1 = főképernyő, 2 = rádiók

  - id: current_page
    type: int
    initial_value: "0"

  - id: radio_count 
    type: int
    initial_value: "0"

  - id: icon_total
    type: int
    initial_value: "0"

  - id: icon_count
    type: int
    initial_value: "0"

  - id: radio_subpage
    type: int
    initial_value: "0"

  - id: max_subpage
    type: int
    initial_value: "0"

  # ikon pointer tömb (24 elem)
  - id: radio_icons
    type: esphome::online_image::OnlineImage* [24]

  - id: current_radio_index
    type: int
    initial_value: '0'

  - id: player_active # lejátszás aktív?
    type: bool
    initial_value: "false"

  - id: player_source
    type: int
    initial_value: "0"  #0 - no media, 1 - radio esp started, 2 - external medi from MA, 3 - YT playlist

 
  - id: cover_busy
    type: bool
    initial_value: 'false'

  - id: cover_last_url
    type: std::string
    initial_value: '""'

  - id: cover_pending_url
    type: std::string
    initial_value: '""'


# ============================
#   Assist - globals
# ============================
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}

  - id: is_tts_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: question_flag
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: is_timer_active
    type: bool
    restore_value: no
# ============================
#   Variables - Numbers
# ============================
number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box  
# ============================
#   Time components
# ============================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update
# ============================
#   Assist_Media_Player
# ============================
media_player:
  - platform: speaker
    buffer_size: 1000000
    name: None
    id: speaker_media_player_id
    media_pipeline:
        format: MP3
        speaker: media_spk_resampling_input
        num_channels: 1
    announcement_pipeline:
        speaker: announcement_spk_resampling_input
        num_channels: 1
    volume_increment: 0.25
    
    on_play:       
      - lambda: |-
          ESP_LOGI("MWW", "Music playback started → wakeword stop");
      - micro_wake_word.stop 
      - lvgl.label.update:
          id: ww_status
          text: "\U000F0A45"
    
    on_idle:
      - lambda: |-
          ESP_LOGI("MWW", "Music idle → wakeword start");
      - delay: 0.1s
      - micro_wake_word.start 
      - lvgl.label.update:
          id: ww_status
          text: "\U000F07C5"
              

    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 24
          duration: 0.25s
      - micro_wake_word.stop
      - lvgl.label.update:
          id: ww_status
          text: "\U000F0A45"
      - lambda: ESP_LOGI("MWW", "Announcement/TTS → wakeword OFF");
              
    on_state:
      - delay: 0.9s
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
          then:
            - mixer_speaker.apply_ducking:
                id: media_spk_mixer_input
                decibel_reduction: 0
                duration: 1.5s
            - if:
                condition:
                  switch.is_on: voice_enabled
                then:
                  - micro_wake_word.start
                  - lambda: |-
                      ESP_LOGI("MWW", "Resuming wakeword after TTS");
                  - lvgl.label.update:
                      id: ww_status
                      text: "\U000F07C5"
                  
                      

    files:
      - id: alarm_sound
        file: sounds/alarm.flac # Placed in the yaml directory. Should be encoded with a 48000 Hz sample rate, mono or stereo audio, and 16 bits per sample.
      - id: beep
        file: sounds/r2d2d.flac
# ============================
#   Assist_Voice_Assistant
# ============================
voice_assistant:
  id: va
  microphone: mic_id
  media_player: speaker_media_player_id
  noise_suppression_level: 2.0
  volume_multiplier: 2.0
  auto_gain: 31dBFS
  micro_wake_word: mww
  on_client_connected:
    - lambda: id(init_in_progress) = false; 
    - if:
        condition:
          switch.is_on: voice_enabled
        then:
          - micro_wake_word.start
          - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          - lvgl.label.update:
              id: ww_status
              text: "\U000F07C5"
         
        else:
          - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
          
  on_client_disconnected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};  
    
  on_listening:
    - lambda: |-
        id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
        id(is_tts_active) = false;
        id(question_flag) = false;
    
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    
  on_stt_end:
  - homeassistant.event:
      event: esphome.stt_text
      data:
        text: !lambda return x; 
  on_tts_start: 
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    
    - lambda: |-
        bool is_question = false;
        if (!x.empty() && x.back() == '?') {
          is_question = true;
        }
        id(question_flag) = is_question;
  on_tts_end:
    - lambda: |-
        id(is_tts_active) = true;
  
    
  on_end:
    - light.turn_off: led
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        not:
          voice_assistant.is_running:
    - delay: 0.7s
    - if:
        condition:
          and:
            - lambda: 'return !id(question_flag);'
            - lambda: 'return id(is_tts_active);'
        then:
          - voice_assistant.start:
        else: 
          - mixer_speaker.apply_ducking:
              id: media_spk_mixer_input
              decibel_reduction: 0
              duration: 1.0s
          - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          

  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id}; 
          
          - delay: 1s
          - if:
              condition:
                switch.is_on: voice_enabled
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
              else:
                - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
# ============================
#   Assist_Mikro_Wake_word
# ============================
micro_wake_word:
  models:
    - model: hey_jarvis
      id: Hey_Jarvis
      probability_cutoff: 0.5
      sliding_window_size: 5
  vad:
    # model: https://github.com/kahrendt/microWakeWord/releases/download/v2.1_models/vad.json
    probability_cutoff: 0.05
  id: mww
  stop_after_detection: false
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
        else:
          - if:
              condition:
                switch.is_on: voice_enabled
              then:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                          then:
                            - media_player.stop:
                                announcement: true
                          else:
                            - media_player.speaker.play_on_device_media_file:
                                media_file: beep
                                announcement: false
                            - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;
                            
# ============================
#   LVGL online images _ icon downloader
# ============================
online_image:
  - id: album_cover
    type: RGB565
    format: jpg
    transparency: alpha_channel
    resize: 96x96
    url: "http://${ha_ip}:${ha_port}/local/icons/default.jpg"
    on_download_finished:
      then:
        - lambda: |-
            id(cover_busy) = false;
            ESP_LOGI("COVER", "Cover downloaded (busy=false)");
        - script.execute: cover_kick

    on_error:
      then:
        - lambda: |-
            id(cover_busy) = false;
            ESP_LOGI("COVER", "Cover download error (busy=false)");
        - script.execute: cover_kick  
    
  - id: radio_icon_0
    type: RGB565
    format: jpg
    transparency: alpha_channel
