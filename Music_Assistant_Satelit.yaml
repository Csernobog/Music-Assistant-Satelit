# ============================
#   Sensors
# ============================   
binary_sensor:
  - platform: template
    id: api_ready
    lambda: |-
      return api::global_api_server->is_connected();

text_sensor:
  - platform: homeassistant
    id: player_picture
    entity_id: ${media_player_name}
    attribute: entity_picture
    on_value:
      then:
        - lambda: |-
            // Radio: nem foglalkozunk borítóval
            if (id(player_source) == 1) return;

            // Helper: URL-encode (RFC3986)
            auto url_encode = [](const std::string &in) -> std::string {
              static const char *hex = "0123456789ABCDEF";
              std::string out;
              out.reserve(in.size() * 3);
              for (unsigned char c : in) {
                if ((c >= 'a' && c <= 'z') ||
                    (c >= 'A' && c <= 'Z') ||
                    (c >= '0' && c <= '9') ||
                    c == '-' || c == '.' || c == '_' || c == '~') {
                  out.push_back((char)c);
                } else {
                  out.push_back('%');
                  out.push_back(hex[(c >> 4) & 0xF]);
                  out.push_back(hex[c & 0xF]);
                }
              }
              return out;
            };

            // Helper: egyszerű prefix check
            auto starts_with = [](const std::string &s, const char *pfx) -> bool {
              return s.rfind(pfx, 0) == 0;
            };

            // Helper: proxy URL építés (helyi MA imageproxy)
            auto build_proxy = [&](const std::string &orig_url) -> std::string {
              // size=96 és fmt=jpeg fix, mert neked 96x96 kell
              // provider legyen állandó (ytmusic), a path hordoz mindent
              return std::string("http://192.168.0.60:8095/imageproxy?provider=ytmusic&size=96&fmt=jpeg&path=")
                     + url_encode(orig_url);
            };

            std::string in = x;

            if (in.empty()) {
              ESP_LOGI("COVER", "No album art");
              return;
            }

            std::string final_url;   // amit ténylegesen letöltünk (proxy vagy direkt)
            std::string small = in;  // opcionálisan méretezett "forrás url"

            // --- SOURCE 2: TRACK (Music Assistant tipikus size=0) ---
            if (id(player_source) == 2) {
              ESP_LOGI("COVER", "TRACK image processing");

              // Csak a "size=0" formátumot dolgozzuk (ahogy eddig)
              auto pos = small.find("size=0");
              if (pos == std::string::npos) {
                ESP_LOGI("COVER", "Skipping non-album image (no size=0)");
                return;
              }
              small.replace(pos, 6, "size=96");

              // Ha már eleve proxys (http://192.168.../imageproxy?...), hagyhatod így,
              // de át is engedheted újra proxyn; itt most meghagyjuk:
              final_url = small;

              ESP_LOGI("COVER", "TRACK Cover URL: %s", final_url.c_str());
            }

            // --- SOURCE 3: YT MUSIC ---
            else if (id(player_source) == 3) {
              ESP_LOGI("COVER", "YT image processing");

              // 1) Googleusercontent méretcsere (ha ez a minta)
              //    (ha más méret jönne, proxy úgyis 96-ra húzza, de ez csökkentheti a proxy workot)
              if (small.find("w600-h600") != std::string::npos) {
                auto p = small.find("w600-h600");
                small.replace(p, 9, "w96-h96");
              }

              // 2) YT képek lehetnek:
              //    - https://lh3.googleusercontent.com/...=w..-h..-p
              //    - https://i.ytimg.com/vi/.../hq720.jpg?sqp=...&rs=...
              //    Mindet proxyn át kérjük le, hogy az ESP ne menjen ki a netre.
              if (starts_with(small, "http://") || starts_with(small, "https://")) {
                final_url = build_proxy(small);
              } else {
                // Ha valamiért nem URL (ritka), akkor ne próbáljuk
                ESP_LOGI("COVER", "Skipping unknown cover format (not http/https)");
                return;
              }

              ESP_LOGI("COVER", "YT Source URL: %s", small.c_str());
              ESP_LOGI("COVER", "YT Proxy URL: %s", final_url.c_str());
            }

            // Más source: most nem kezeljük
            else {
              ESP_LOGI("COVER", "Skipping cover (unknown player_source=%d)", id(player_source));
              return;
            }

            // --- Duplázás elkerülése ---
            if (!final_url.empty() && final_url == id(cover_last_url)) {
              ESP_LOGI("COVER", "Cover unchanged, skipping");
              return;
            }
            id(cover_last_url) = final_url;

            // --- Pending kezelés ---
            // Ha épp letölt, akkor csak felülírjuk a pending-et (legfrissebb nyer).

            id(cover_pending_url) = final_url;
            ESP_LOGI("COVER", "YT Proxy download URL: %s", final_url.c_str());
            // Indítsuk el, ha lehet
            ESP_LOGI("COVER", "Script Cover_kick started");
            id(cover_kick).execute();

        

