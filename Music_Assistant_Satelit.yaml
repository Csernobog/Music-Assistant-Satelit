# ============================
#   LVGL UI Init
# ============================
lvgl:
  rotation: 270
  disp_bg_color: black
  buffer_size: 25%
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: backlight
      - lvgl.pause: 



  style_definitions:
    - id: header_footer
      bg_color: 0x808080
      bg_grad_color: 0x303030
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 1
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0xFFFFFF
      width: 100%
      height: 28
# ============================
#   Header & Footer
# ============================ 
  top_layer:
    widgets:
      - label:
          text: "\U000F16BF"
          text_font: icons_100
          id: lbl_hastatus
          hidden: true
          align: top_right
          x: -10
          y: 5
          text_align: right
          text_color: 0xFFFFFF
      - label:    
          text: "\U000F07C5"
          text_font: icons_100
          id: ww_status
          #hidden: true
          x: 270
          y: 5
          text_align: right
          text_color: 0xFFFFFF
      - label:
          text: "\U000F121C"
          text_font: icons_100
          id: radio_status
          x: 250
          y: 5
          text_align: right
          text_color: 0xFFFFFF

      - buttonmatrix:
          align: bottom_mid
          styles: header_footer
          pad_all: 0
          outline_width: 0
          id: top_layer
          items:
            styles: header_footer
          rows:
            - buttons:
              - id: page_prev
                text: "\uF053"
                on_press:
                  then:
                    - script.execute: nav_prev
              - id: page_home
