  - platform: homeassistant 
  # kedvemc rádiók áttöltése a HA-ból (sensor.radiok <- pyscript.get_ma_radios tölti fel)
  # max 24 kedvenc rádió az MA alatt, ha nincs ikonja, vagy mem négyzetes -# saját ikon generálás neki

    id: ha_radios_json
    entity_id: sensor.radiok
    attribute: radios
    on_value:
      then:
    # ---- 0. BIZTONSÁG: ha már egyszer feldolgoztuk, SOHA többé ne fusson le ----
        - lambda: |-
            if (id(already_fetched)) {
              ESP_LOGI("RADIO", "ha_radios_json: JSON already processed, skipping.");
              return;
            }

            ESP_LOGI("RADIO", "ha_radios_json: Processing radio list for the FIRST time...");

            // reset flags for initial load
            id(radio_count) = 0;
            id(icon_total) = 0;
            id(icon_count) = 0;
            id(icons_downloaded) = false;

            std::string data = id(ha_radios_json).state;
            ESP_LOGI("RADIO", "Raw radios attribute: %s", data.c_str());

            // ---- 1. Quote normalization ----
            for (char &c : data) {
              if (c == '\'') c = '"';
            }

            size_t pos = 0;
            int index = 0;

            while (true) {
              // --- JSON object search ---
              size_t start = data.find("{", pos);
              if (start == std::string::npos) break;

              size_t end = data.find("}", start);
              if (end == std::string::npos) break;

              std::string obj = data.substr(start, end - start + 1);

              // ---- Extract URI ----
              std::string uri;
              {
                size_t u1 = obj.find("\"uri\"");
                if (u1 != std::string::npos) {
                  size_t q1 = obj.find("\"", u1 + 5);
                  size_t q2 = obj.find("\"", q1 + 1);
                  if (q1 != std::string::npos && q2 != std::string::npos)
                    uri = obj.substr(q1 + 1, q2 - q1 - 1);
                }
              }

              // ---- Extract NAME ----
              std::string name;
              {
                size_t n1 = obj.find("\"name\"");
                if (n1 != std::string::npos) {
                  size_t q1 = obj.find("\"", n1 + 6);
                  size_t q2 = obj.find("\"", q1 + 1);
                  if (q1 != std::string::npos && q2 != std::string::npos)
                    name = obj.substr(q1 + 1, q2 - q1 - 1);
                }
              }

              // ---- Extract IMAGE ----
              std::string image;
              {
                size_t i1 = obj.find("\"image\"");
                if (i1 != std::string::npos) {
                  size_t q1 = obj.find("\"", i1 + 7);
                  size_t q2 = obj.find("\"", q1 + 1);
                  if (q1 != std::string::npos && q2 != std::string::npos)
                    image = obj.substr(q1 + 1, q2 - q1 - 1);
                }
              }

              // if no image, skip this entry
              if (image.empty()) {
                pos = end + 1;
                continue;
              }

              // ---- Build full URL ----
              std::string full_url = std::string("http://${ha_ip}:${ha_port}") + image;

              ESP_LOGI("RADIO", "Radio %d → URI=%s NAME=%s IMG=%s",
                index, uri.c_str(), name.c_str(), full_url.c_str());

              // ---- Set icon URL ----
              switch (index) {
                case 0:  id(radio_icon_0).set_url(full_url.c_str()); break;
                case 1:  id(radio_icon_1).set_url(full_url.c_str()); break;
                case 2:  id(radio_icon_2).set_url(full_url.c_str()); break;
                case 3:  id(radio_icon_3).set_url(full_url.c_str()); break;
                case 4:  id(radio_icon_4).set_url(full_url.c_str()); break;
                case 5:  id(radio_icon_5).set_url(full_url.c_str()); break;
                case 6:  id(radio_icon_6).set_url(full_url.c_str()); break;
                case 7:  id(radio_icon_7).set_url(full_url.c_str()); break;
                case 8:  id(radio_icon_8).set_url(full_url.c_str()); break;
                case 9:  id(radio_icon_9).set_url(full_url.c_str()); break;
                case 10: id(radio_icon_10).set_url(full_url.c_str()); break;
                case 11: id(radio_icon_11).set_url(full_url.c_str()); break;
                case 12: id(radio_icon_12).set_url(full_url.c_str()); break;
                case 13: id(radio_icon_13).set_url(full_url.c_str()); break;
                case 14: id(radio_icon_14).set_url(full_url.c_str()); break;
                case 15: id(radio_icon_15).set_url(full_url.c_str()); break;
                case 16: id(radio_icon_16).set_url(full_url.c_str()); break;
                case 17: id(radio_icon_17).set_url(full_url.c_str()); break;
                case 18: id(radio_icon_18).set_url(full_url.c_str()); break;
                case 19: id(radio_icon_19).set_url(full_url.c_str()); break;
                case 20: id(radio_icon_20).set_url(full_url.c_str()); break;
                case 21: id(radio_icon_21).set_url(full_url.c_str()); break;
                case 22: id(radio_icon_22).set_url(full_url.c_str()); break;
                case 23: id(radio_icon_23).set_url(full_url.c_str()); break;
              }
              id(radio_items).push_back( std::make_tuple(uri, name, full_url) );
              index++;
              pos = end + 1;
            }

            id(radio_count) = index;
            id(icon_total) = index;

            ESP_LOGI("RADIO", "Loaded %d radios total", index);

            // ----- 2. INDÍTÁS CSAK EGYSZER -----
            if (!id(icons_downloaded) && index > 0) {
              id(current_icon_download) = 0;
              id(icons_downloaded) = false;
              ESP_LOGI("ICON", "Starting sequential icon download...");
              id(icon_count) = 0;
              id(radio_icon_0).update();
            }

            // ----- 3. lezárás: többé ne fusson soha -----
            id(already_fetched) = true;
            id(radios_fetched) = true;

